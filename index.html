<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="120" />
    <title>HTML Color Picker PRO — Under Maintenance</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='4' y1='4' x2='28' y2='28' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='55%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='%230a0d17'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <style>
      :root {
        --bg-page: #0a0d17;
        --bg-card: #10131f;
        --border-subtle: #1e2233;
        --border-default: #262b40;
        --text-primary: #f3f4f8;
        --text-secondary: #a6acc1;
        --text-muted: #6b7189;
        --accent-purple: #8b5cf6;
        --accent-blue: #6366f1;
        --accent-pink: #ec4899;
        --font-base: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: var(--font-base);
        color: var(--text-primary);
        background: var(--bg-page);
        background-image:
          radial-gradient(
            circle at 15% 0%,
            rgba(139, 92, 246, 0.1),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 10%,
            rgba(99, 102, 241, 0.1),
            transparent 40%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(236, 72, 153, 0.06),
            transparent 45%
          );
      }
      .card {
        width: 100%;
        max-width: 460px;
        text-align: center;
        background: var(--bg-card);
        border: 1px solid var(--border-default);
        border-radius: 20px;
        padding: 48px 36px 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .logo-mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 28px;
        border-radius: 50%;
        position: relative;
        background: conic-gradient(
          from 180deg,
          var(--accent-purple),
          var(--accent-blue),
          var(--accent-pink),
          var(--accent-purple)
        );
        animation: pulse 2.2s ease-in-out infinite;
      }
      .logo-mark::after {
        content: "";
        position: absolute;
        inset: 17px;
        border-radius: 50%;
        background: var(--bg-card);
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-mark {
          animation: none;
        }
      }
      .brand {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-muted);
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 26px;
        font-weight: 700;
        line-height: 1.3;
      }
      h1 .grad {
        background: linear-gradient(
          90deg,
          var(--accent-purple),
          var(--accent-blue),
          var(--accent-pink)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 0 8px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-secondary);
      }
      .divider {
        height: 1px;
        background: var(--border-subtle);
        margin: 28px 0 24px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-purple);
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo-mark" aria-hidden="true"></div>
      <div class="brand">
        HTML COLOR PICKER
        <strong style="color: var(--accent-purple)">PRO</strong>
      </div>
      <h1>We're making things <span class="grad">even better</span></h1>
      <p>
        The site is currently undergoing scheduled maintenance while we polish a
        few things behind the scenes.
      </p>
      <p>We'll be back shortly — thanks for your patience.</p>
      <div class="divider"></div>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        Maintenance in progress — this page refreshes automatically
      </div>
    </main>
  </body>
</html>
